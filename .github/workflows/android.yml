name: Build Android APK

# The debug APK produced here is the app you install on your phone.
# You can start a build yourself from the Actions tab -> "Build Android APK" -> "Run workflow".
on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    env:
      # Bump these together with the database version when a new migration is written.
      MIGRATION_FILE: app/src/main/java/com/rishaanlabs/ros/data/local/migration/FinanceMigration.kt
      FROM_VERSION: "1"
      TO_VERSION: "2"
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Tee the output so the next step can pull the compiler errors back out. Without this a
      # failure buries the one useful line under a few hundred lines of Gradle stack trace.
      - name: Run unit tests and build debug APK
        run: |
          set -o pipefail
          ./gradlew test assembleDebug --no-daemon 2>&1 | tee build.log

      # The checker is the only thing between a wrong migration and an app that dies on launch
      # against real data, so it is itself tested before it is trusted.
      - name: Test the migration checker
        run: python3 scripts/test_verify_room_migration.py

      # Room only checks a migration against the entities when the app opens an existing database
      # on a real device — by which point a mismatch is a crash on the user's data. The build has
      # just exported the schema Room expects, so compare the migration against it here instead.
      - name: Verify the Room migration matches the exported schema
        run: |
          python3 scripts/verify_room_migration.py \
            app/schemas \
            "$MIGRATION_FILE" \
            "$FROM_VERSION" "$TO_VERSION"

      # TEMPORARY (remove once app/schemas is committed): print the exported schema so the first
      # copy can be taken from the log. There is no Android SDK outside CI to generate it.
      - name: Print exported schema for bootstrap
        run: |
          for f in $(find app/schemas -name '*.json' | sort); do
            echo "===BEGIN $f==="
            python3 -c "import json,sys; print(json.dumps(json.load(open(sys.argv[1])), indent=1, sort_keys=False))" "$f"
            echo "===END $f==="
          done

      # The exported schema is committed so later migrations can be checked against it. If the
      # build just produced something different, the entities changed and the schema was not
      # committed with them — which is how the next migration ends up unverifiable.
      - name: Check the committed schema matches the build
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::app/schemas is out of date. Commit what the build exported."
            git status --porcelain app/schemas
            git --no-pager diff -- app/schemas | head -80
            exit 1
          fi
          echo "Committed schema matches the build."

      # Kept for retrieving a newly exported schema when adding a version.
      - name: Upload exported Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas
          if-no-files-found: warn

      - name: Summarise build errors
        if: failure()
        run: |
          echo "===== compiler errors ====="
          grep -E '^e: |^error: ' build.log | head -60 || echo "(no compiler error lines)"
          echo "===== what went wrong ====="
          sed -n '/What went wrong/,/^\* Try/p' build.log | head -40 || true

      # Fail loudly here rather than uploading a silently empty artifact.
      - name: Verify APK exists and give it a readable name
        id: apk
        run: |
          set -euo pipefail
          BUILT=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$BUILT" ]; then
            echo "::error::No APK at $BUILT"
            find app/build/outputs -name '*.apk' -print || echo "(no APK anywhere under app/build/outputs)"
            exit 1
          fi

          # Read the version out of the build file so the filename can never drift from the build.
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | cut -d'"' -f2)
          NAME="Rishaan-OS-v${VERSION}-debug.apk"

          mkdir -p artifact
          cp "$BUILT" "artifact/${NAME}"

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "### Rishaan OS debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: \`${NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(du -h "artifact/${NAME}" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from the **Artifacts** section at the bottom of this page." >> "$GITHUB_STEP_SUMMARY"

          ls -lh "artifact/${NAME}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rishaan-os-debug
          path: artifact/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
